services:
  backend:
    build:
      context: ./backend
    container_name: wind-forecast-backend
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: wind-forecast-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
